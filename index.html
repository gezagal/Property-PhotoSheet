<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#234b34"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fotólap"><link rel="icon" href="%BASE_URL%icon.svg"><link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
  <title>Property PhotoSheet</title>
</head>
<body>
<main class="app">
  <header class="app-header"><div><h1>Ingatlan Fotólap</h1><p>Gyors, helyben működő fotólap-készítő értékbecsléshez</p></div><button id="installBtn" class="btn secondary" hidden>Telepítés</button></header>
  <section class="card form-grid"><label>Cím *<input id="address" autocomplete="street-address" placeholder="1135 Budapest, Reitter Ferenc utca 96."></label><label>Helyrajzi szám *<input id="hrsz" placeholder="27115/A/128"></label></section>
  <section class="card">
    <button id="pickPhotos" class="drop-zone"><strong>📷 Fotók hozzáadása</strong><span>Képek kiválasztása vagy fényképezés</span></button><input id="photoInput" type="file" accept="image/*" multiple hidden>
    <div class="toolbar compact"><button id="flatTemplate" class="btn secondary">Lakás sablon</button><button id="houseTemplate" class="btn secondary">Ház sablon</button><button id="clearCaptions" class="btn danger">Feliratok törlése</button></div>
    <p id="status" class="status" aria-live="polite"></p><div id="photoList" class="photo-list"></div><datalist id="captionLabels"></datalist>
  </section>
  <section class="card actions"><button id="saveSession" class="btn secondary">Munka exportálása</button><button id="loadSession" class="btn secondary">Munka betöltése</button><input id="sessionInput" type="file" accept="application/json,.json" hidden><button id="previewPdf" class="btn secondary">Előnézet</button><button id="savePdf" class="btn primary">PDF mentése</button></section>
  <p class="privacy">A fotók ezen az eszközön maradnak. A munka automatikusan mentődik helyben.</p>
</main>
<dialog id="previewDialog"><div class="dialog-toolbar"><strong>PDF-előnézet</strong><button id="closePreview" class="btn secondary">Bezárás</button></div><div id="previewPages"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="/src/main.ts"></script>
</body></html>
